trigger:
  - master

pool:
  name: "Default" # Your Windows self-hosted agent pool

variables:
  dockerRegistryServiceConnection: "acr-conn"
  kubernetesServiceConnection: "aks-conn"
  acrHost: "threetierregistry.azurecr.io"
  tag: "$(Build.BuildId)"

stages:
  - stage: CI_CD
    displayName: "Build, Scan, and Deploy"
    jobs:
      - job: Build_And_Deploy
        steps:
          - script: echo "Running Unit Tests..."
            displayName: "1. Unit Test"

          - task: Docker@2
            displayName: "2. Build and Push (ARM64)"
            inputs:
              containerRegistry: $(dockerRegistryServiceConnection)
              repository: "threetier-app"
              command: "buildAndPush"
              # Matches your Standard_B2pls_v2 nodes
              arguments: "--platform linux/arm64"
              tags: |
                $(tag)

          # --- FIX FOR UNAUTHORIZED ERROR ---
          - task: Docker@2
            displayName: "Login for Security Scan"
            inputs:
              containerRegistry: $(dockerRegistryServiceConnection)
              command: "login"

          - script: |
              REM Using the local docker socket to scan the image we just logged into
              docker run --rm -v //var/run/docker.sock:/var/run/docker.sock aquasec/trivy image $(acrHost)/threetier-app:$(tag)
            displayName: "3. Security Scan"

          - task: KubernetesManifest@1
            displayName: "4. Deploy to AKS"
            inputs:
              action: "deploy"
              connectionType: "kubernetesServiceConnection"
              kubernetesServiceConnection: $(kubernetesServiceConnection)
              namespace: "default"
              manifests: |
                $(System.DefaultWorkingDirectory)/k8s-spec.yaml
              containers: |
                $(acrHost)/threetier-app:$(tag)
