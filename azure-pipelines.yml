trigger:
  - master # Apnar branch-er naam 'master' tai ekhane 'master' thakbe

pool:
  name: "Default" # Oboshoy 'Default' thakbe karon apni Self-hosted agent setup korchen

variables:
  dockerComposeFile: "docker-compose.yml"

steps:
  # 1. Docker Compose Setup check kora
  - script: |
      docker-compose --version
    displayName: "Check Docker Compose Version"

  # 2. Docker images build kora (Backend & Frontend)
  - script: |
      docker-compose build
    displayName: "Build Docker Images (3-Tier)"

  # 3. Services gulo run kora (Testing-er jonno)
  - script: |
      docker-compose up -d
      docker ps
    displayName: "Deploy Services Locally"

  # 4. Cleanup (Interview-er samne clean rakhar jonno)
  - script: |
      docker-compose down
    displayName: "Cleanup Containers"
