trigger:
  - master

pool:
  name: "Default"

steps:
  # 1. Docker version check (troubleshooting-er jonno thak)
  - script: |
      docker compose version
    displayName: "Check Docker Version"

  # 2. Build ebong Run (Secrets soho)
  - script: |
      docker compose up -d --build
    displayName: "Deploy and Keep Services Running"
    env:
      MONGO_URI: $(MONGO_URI)
      MONGO_USER: $(MONGO_USER)
      MONGO_PASS: $(MONGO_PASS)

  # 3. Running containers check s
  - script: |
      docker ps
    displayName: "Verify Running Containers"
